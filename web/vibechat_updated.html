<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VibeChat — realtime messaging</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    :root {
      --bg-base: #f4f5f7; --bg-panel: #ffffff; --bg-hover: #eef2f6;
      --text-primary: #121212; --text-secondary: #6b7280;
      --accent-glow: #8b5cf6; --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08); --nav-height: 80px; --bottom-nav-height: 70px;
    }
    body {
      background-color: var(--bg-base); color: var(--text-primary);
      font-family: 'Outfit', sans-serif; margin: 0;
      transition: background 0.3s ease; overflow-x: hidden;
    }
    .ambient-bg {
      position: fixed; top: -20%; left: -10%; width: 120vw; height: 120vh;
      background: radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.2) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(56, 239, 125, 0.1) 0%, transparent 50%);
      filter: blur(80px); z-index: -1; pointer-events: none;
      animation: ambientMove 12s infinite alternate;
    }
    @keyframes ambientMove { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 1; } }
    .landing-top-nav {
      position: fixed; top: 0; width: 100%; height: var(--nav-height);
      background: var(--glass-bg); backdrop-filter: blur(25px); z-index: 1000;
      display: flex; align-items: center; padding: 0 5%; border-bottom: 1px solid var(--glass-border);
    }
    .brand-logo { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .hero-section { min-height: 100vh; display: flex; align-items: center; padding: calc(var(--nav-height) + 20px) 5% 50px; }
    .hero-title { font-size: clamp(3rem, 6vw, 5rem); font-weight: 800; line-height: 1.1; letter-spacing: -2px; }
    .hero-title span { color: var(--accent-glow); }
    .btn-glow { background: var(--accent-glow); color: white; padding: 14px 34px; border-radius: 40px; font-weight: 700; border: none; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }
    .btn-outline-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1.5px solid var(--glass-border); padding: 14px 34px; border-radius: 40px; font-weight: 600; color: var(--text-primary); }
    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); z-index: 2000;
      display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .auth-overlay.active { opacity: 1; pointer-events: auto; }
    .auth-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 36px;
      width: 92%; max-width: 440px; padding: 32px 28px; transform: translateY(30px); transition: 0.3s;
    }
    .auth-overlay.active .auth-card { transform: translateY(0); }
    .auth-close { position: absolute; top: 16px; right: 20px; background: var(--bg-hover); border: none; width: 34px; height: 34px; border-radius: 30px; color: var(--text-primary); }
    .auth-tabs { display: flex; background: var(--bg-hover); padding: 5px; border-radius: 40px; margin-bottom: 28px; }
    .auth-tab-btn { flex: 1; border: none; background: transparent; padding: 10px; border-radius: 34px; font-weight: 600; color: var(--text-secondary); }
    .auth-tab-btn.active { background: var(--bg-panel); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .auth-field { width: 100%; background: var(--bg-panel); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 14px 18px; border-radius: 20px; margin-bottom: 16px; outline: none; font-family: 'Outfit'; }
    .btn-auth-submit { width: 100%; background: var(--text-primary); color: var(--bg-panel); padding: 14px; border-radius: 28px; font-weight: 700; border: none; }
    .btn-google-login { width: 100%; background: var(--bg-panel); border: 1px solid var(--glass-border); border-radius: 30px; padding: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; cursor: pointer; color: var(--text-primary); }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; height: var(--bottom-nav-height);
      background: var(--glass-bg); backdrop-filter: blur(28px); display: flex; justify-content: space-around; align-items: center;
      z-index: 1000; border-top: 1px solid var(--glass-border); transition: transform 0.25s ease;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav a { color: var(--text-secondary); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; font-weight: 600; gap: 4px; }
    .bottom-nav a i { font-size: 1.6rem; }
    .bottom-nav a.active { color: var(--accent-glow); }
    .app-page { display: none; animation: fadePage 0.25s ease; padding-bottom: calc(var(--bottom-nav-height) + 20px); min-height: 100vh; }
    .app-page.active { display: block; }
    @keyframes fadePage { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .app-header { position: sticky; top: 0; background: linear-gradient(to bottom, var(--bg-base) 70%, transparent); padding: 20px 20px 12px; z-index: 99; backdrop-filter: blur(12px); }
    .chat-list { padding: 0 12px; }
    .chat-item { display: flex; align-items: center; padding: 14px; border-radius: 24px; cursor: pointer; background: var(--bg-panel); margin-bottom: 10px; border: 1px solid var(--glass-border); transition: 0.1s; }
    .chat-item:active { transform: scale(0.98); background: var(--bg-hover); }
    .chat-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; margin-right: 14px; border: 2px solid var(--accent-glow); }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 800; font-size: 1rem; margin: 0; }
    .chat-last-msg { font-size: 0.8rem; color: var(--text-secondary); margin: 4px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .profile-card { background: var(--bg-panel); border: 1px solid var(--glass-border); border-radius: 32px; padding: 30px; text-align: center; margin: 20px; }
    .profile-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent-glow); }
    #page-chat {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-base); z-index: 2000; display: none; flex-direction: column; height: 100dvh;
    }
    #page-chat.active { display: flex !important; }
    .chat-header-bar { flex: 0 0 72px; width: 100%; display: flex; align-items: center; padding: 0 20px; gap: 12px; background: var(--glass-bg); backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-container { flex-shrink: 0; width: 100%; padding: 14px 18px; background: var(--glass-bg); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; gap: 12px; align-items: center; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    .chat-input { flex: 1; background: var(--bg-panel); border: 1px solid var(--glass-border); padding: 14px 18px; border-radius: 34px; outline: none; color: var(--text-primary); font-family: 'Outfit'; }
    .chat-input:focus { border-color: var(--accent-glow); }
    .btn-send { background: var(--accent-glow); width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 1.3rem; transition: 0.15s; cursor: pointer; }
    .msg-bubble { max-width: 80%; padding: 12px 18px; border-radius: 24px; font-size: 0.94rem; line-height: 1.4; word-wrap: break-word; }
    .msg-received { background: var(--bg-panel); border: 1px solid var(--glass-border); border-bottom-left-radius: 6px; align-self: flex-start; }
    .msg-sent { background: var(--accent-glow); color: white; border-bottom-right-radius: 6px; align-self: flex-end; }
    .msg-time { font-size: 0.6rem; opacity: 0.7; margin-top: 6px; text-align: right; }
  </style>
</head>
<body>
<div class="ambient-bg"></div>

<div id="landingView">
  <nav class="landing-top-nav"><a href="#" class="brand-logo"><i class="bi bi-chat-heart-fill"></i> VibeChat</a></nav>
  <section class="hero-section container-fluid">
    <div class="row w-100 justify-content-center text-center">
      <div class="col-lg-8">
        <h1 class="hero-title">Vibe <span>deeper.</span><br>Talk freely.</h1>
        <p class="hero-subtitle fs-5 text-muted mb-4">Realtime encrypted chat — instant, fluid, modern.</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
          <button class="btn-glow" onclick="window.openAuthModal('signup')">✨ Sign Up free</button>
          <button class="btn-outline-glass" onclick="window.openAuthModal('login')">Log In</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="appContainer" class="d-none">
  <div id="page-home" class="app-page">
    <div class="app-header"><h2 class="fw-bold m-0">Inbox</h2></div>
    <div id="inboxContainer" class="chat-list"><div class="text-center mt-5"><div class="spinner-border text-primary"></div></div></div>
  </div>
  <div id="page-search" class="app-page">
    <div class="app-header"><h2 class="fw-bold m-0">Discover</h2></div>
    <div class="px-3 mt-2">
      <div class="d-flex px-3 py-2" style="background: var(--bg-panel); border-radius: 40px; border:1px solid var(--glass-border);">
        <i class="bi bi-search fs-5 text-muted me-2"></i>
        <input type="text" id="searchInput" class="w-100 bg-transparent border-0" placeholder="Search by username..." style="outline:none; color:var(--text-primary);" oninput="window.handleUserSearch(this.value)">
      </div>
      <div id="searchResults" class="mt-4"></div>
    </div>
  </div>
  <div id="page-profile" class="app-page">
    <div class="app-header"><h2 class="fw-bold m-0">Profile</h2></div>
    <div class="profile-card">
      <img src="" id="profImg" class="profile-img">
      <h3 class="fw-bold mt-3" id="profName">...</h3>
      <p class="text-muted" id="profUsername">@user</p>
      <p class="small text-muted" id="profEmail"></p>
      <button class="btn btn-danger rounded-pill px-4 mt-3 fw-bold" onclick="window.handleLogout()">Log out</button>
    </div>
  </div>

  <div id="page-chat">
    <div class="chat-header-bar">
      <i class="bi bi-arrow-left fs-3" id="chatBackBtn" style="cursor: pointer; color: var(--text-primary);"></i>
      <img src="" id="chatTargetImg" style="width: 48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--accent-glow);">
      <div>
        <h5 class="m-0 fw-bold" id="chatTargetName">...</h5>
        <small class="text-muted" id="chatTargetUsername">@handle</small>
      </div>
    </div>
    <div class="chat-messages" id="chatMessagesArea"><div class="text-center mt-5"><div class="spinner-border"></div></div></div>
    <div class="chat-input-container">
      <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') window.sendMessage()">
      <button class="btn-send" onclick="window.sendMessage()"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <a href="#home" class="active"><i class="bi bi-chat-fill"></i><span>Chats</span></a>
    <a href="#search"><i class="bi bi-search"></i><span>Search</span></a>
    <a href="#profile"><i class="bi bi-person-fill"></i><span>Profile</span></a>
  </nav>
</div>

<div class="auth-overlay" id="authOverlay" onclick="window.closeAuthModal(event)">
  <div class="auth-card" onclick="event.stopPropagation()">
    <button class="auth-close" onclick="window.closeAuthModal(null)"><i class="bi bi-x-lg"></i></button>
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-login" onclick="window.switchAuthTab('login')">Log In</button>
      <button class="auth-tab-btn" id="tab-signup" onclick="window.switchAuthTab('signup')">Sign Up</button>
    </div>
    <button class="btn-google-login" onclick="window.loginWithGoogle()"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20"> Continue with Google</button>
    <form id="authForm" onsubmit="window.handleAuthSubmit(event)">
      <div id="signupUsernameGroup" class="d-none"><input type="text" id="signupUsername" class="auth-field" placeholder="Unique username (e.g. alex_123)"></div>
      <div id="signupEmailGroup" class="d-none"><input type="email" id="signupEmail" class="auth-field" placeholder="Email"></div>
      <div id="loginIdGroup"><input type="text" id="loginId" class="auth-field" placeholder="Username or Email"></div>
      <input type="password" id="authPassword" class="auth-field" placeholder="Password" required>
      <button type="submit" class="btn-auth-submit" id="submitBtnText">Log In</button>
    </form>
  </div>
</div>

<script type="importmap">
  { "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js", "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js", "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js" } }
</script>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "firebase/auth";
  import { getDatabase, ref, get, set, push, onValue, update, serverTimestamp } from "firebase/database";

  const firebaseConfig = {
    apiKey: "AIzaSyCxJqJadOqmVA9XHUEnf_bzY8_j9WhoOsc",
    authDomain: "chat-ebbc6.firebaseapp.com",
    databaseURL: "https://chat-ebbc6-default-rtdb.firebaseio.com",
    projectId: "chat-ebbc6",
    storageBucket: "chat-ebbc6.firebasestorage.app",
    appId: "1:900704224803:web:849180c787132c7baa1396"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const googleProvider = new GoogleAuthProvider();

  let currentUser = null;
  let inboxUnsubscribe = null;
  let chatUnsubscribe = null;
  let activeChatPartner = null;

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  // ------------------ REAL-TIME CHAT (OPTIMIZED WITH SERVER TIMESTAMP) ------------------
  async function openChatRoom(partnerId) {
    if (!currentUser) return;
    if (chatUnsubscribe) chatUnsubscribe();
    activeChatPartner = partnerId;
    
    const partnerSnap = await get(ref(db, `users/${partnerId}`));
    if (partnerSnap.exists()) {
      const p = partnerSnap.val();
      document.getElementById('chatTargetName').innerText = p.username;
      document.getElementById('chatTargetUsername').innerText = `@${p.lower_username}`;
      document.getElementById('chatTargetImg').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.username)}&background=8b5cf6&color=fff`;
    }
    
    const chatId = [currentUser.uid, partnerId].sort().join('_');
    const msgRef = ref(db, `chats/${chatId}/messages`);
    const area = document.getElementById('chatMessagesArea');
    area.innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary"></div></div>';
    
    chatUnsubscribe = onValue(msgRef, (snap) => {
      area.innerHTML = '';
      if (!snap.exists()) {
        area.innerHTML = '<p class="text-center text-muted mt-5">✨ No messages yet. Say hello!</p>';
        return;
      }
      const messages = [];
      snap.forEach(child => messages.push({ id: child.key, ...child.val() }));
      messages.sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));
      
      let html = '';
      for (let msg of messages) {
        const isMe = msg.senderId === currentUser.uid;
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : 'Sending...';
        html += `
          <div class="msg-bubble ${isMe ? 'msg-sent' : 'msg-received'}">
            ${escapeHtml(msg.text)}
            <span class="msg-time" style="${isMe ? 'color:rgba(255,255,240,0.8)' : 'color:var(--text-secondary)'}">${timeStr}</span>
          </div>
        `;
      }
      area.innerHTML = html;
      setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
    });
  }

  // ATOMIC WRITE FOR INSTANT SYNCING ON BOTH SIDES
  window.sendMessage = async () => {
    if (!currentUser || !activeChatPartner) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    
    const chatId = [currentUser.uid, activeChatPartner].sort().join('_');
    
    try {
      const newMsgKey = push(ref(db, `chats/${chatId}/messages`)).key;
      const updates = {};
      
      updates[`chats/${chatId}/messages/${newMsgKey}`] = {
        senderId: currentUser.uid,
        text: text,
        timestamp: serverTimestamp()
      };
      
      updates[`user_inbox/${currentUser.uid}/${activeChatPartner}`] = {
        partnerId: activeChatPartner,
        lastMessage: text,
        timestamp: serverTimestamp()
      };
      
      updates[`user_inbox/${activeChatPartner}/${currentUser.uid}`] = {
        partnerId: currentUser.uid,
        lastMessage: text,
        timestamp: serverTimestamp()
      };
      
      await update(ref(db), updates);
    } catch (error) {
      console.error("Error sending message:", error);
      Swal.fire({ icon: 'error', title: 'Error', text: 'Message send nahi ho paya. Firebase Security Rules check karein.', background:'var(--bg-panel)' });
    }
  };

  // ------------------ INBOX (REALTIME + PARALLEL FETCHING) ------------------
  async function loadInbox(uid) {
    if (inboxUnsubscribe) inboxUnsubscribe();
    const container = document.getElementById('inboxContainer');
    const userInboxRef = ref(db, `user_inbox/${uid}`);
    
    inboxUnsubscribe = onValue(userInboxRef, async (snapshot) => {
      if (!snapshot.exists()) {
        container.innerHTML = `<div class="empty-state"><i class="bi bi-chat-heart fs-1"></i><h4 class="mt-3">No conversations yet</h4><button class="btn btn-sm btn-outline-glass mt-2" onclick="window.location.hash='#search'">Find friends</button></div>`;
        return;
      }
      const chats = [];
      snapshot.forEach(child => chats.push({ partnerId: child.key, ...child.val() }));
      chats.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
      
      let html = '';
      await Promise.all(chats.map(async (chat) => {
        const userSnap = await get(ref(db, `users/${chat.partnerId}`));
        if (userSnap.exists()) {
          const user = userSnap.val();
          const timeStr = chat.timestamp ? new Date(chat.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
          html += `
            <div class="chat-item" onclick="window.navigateToChat('${user.uid}', '${escapeHtml(user.username)}', '${user.lower_username}')">
              <img class="chat-avatar" src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.username)}&background=8b5cf6&color=fff">
              <div class="chat-info">
                <div class="d-flex justify-content-between"><strong class="chat-name">${escapeHtml(user.username)}</strong><small class="text-muted">${timeStr}</small></div>
                <p class="chat-last-msg">${escapeHtml(chat.lastMessage.substring(0, 60))}</p>
              </div>
            </div>
          `;
        }
      }));
      container.innerHTML = html;
    });
  }

  // ------------------ SEARCH ------------------
  window.handleUserSearch = async (query) => {
    const term = query.trim().toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    if (!term) {
      resultsDiv.innerHTML = `<div class="empty-state"><i class="bi bi-search fs-1"></i><h5>Find people to vibe with</h5></div>`;
      return;
    }
    try {
      const usersSnap = await get(ref(db, 'users'));
      resultsDiv.innerHTML = '';
      let found = false;
      for (const child of usersSnap.children()) {
        const user = child.val();
        if (user.lower_username && user.lower_username.includes(term) && user.uid !== currentUser?.uid) {
          found = true;
          resultsDiv.innerHTML += `
            <div class="chat-item" onclick="window.navigateToChat('${user.uid}', '${escapeHtml(user.username)}', '${user.lower_username}')">
              <img class="chat-avatar" src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.username)}&background=8b5cf6&color=fff">
              <div class="chat-info"><p class="chat-name fw-bold">${escapeHtml(user.username)}</p><p class="chat-last-msg">@${user.lower_username}</p></div>
            </div>
          `;
        }
      }
      if (!found) resultsDiv.innerHTML = '<div class="empty-state"><i class="bi bi-person-x fs-1"></i><p class="mt-2">No user matches</p></div>';
    } catch(e) { resultsDiv.innerHTML = '<p class="text-danger">Error searching</p>'; }
  };

  window.navigateToChat = (uid, name, username) => {
    if (!uid) return;
    document.getElementById('chatTargetName').innerText = name;
    document.getElementById('chatTargetUsername').innerText = `@${username}`;
    document.getElementById('chatTargetImg').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=8b5cf6&color=fff`;
    window.location.hash = `#chat-${uid}`;
  };

  function closeChatAndGoHome() {
    if (chatUnsubscribe) chatUnsubscribe();
    chatUnsubscribe = null;
    activeChatPartner = null;
    document.getElementById('page-chat').classList.remove('active');
    document.getElementById('bottomNav').style.transform = 'translateY(0)';
    window.location.hash = '#home';
  }

  function route() {
    if (!currentUser || document.getElementById('appContainer').classList.contains('d-none')) return;
    const hash = window.location.hash.slice(1) || 'home';
    if (hash.startsWith('chat-')) {
      const partnerUid = hash.split('-')[1];
      if (partnerUid) {
        document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-chat').classList.add('active');
        document.getElementById('bottomNav').style.transform = 'translateY(100%)';
        openChatRoom(partnerUid);
      }
      return;
    }
    if (document.getElementById('page-chat').classList.contains('active')) {
      if (chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = null;
      activeChatPartner = null;
      document.getElementById('page-chat').classList.remove('active');
    }
    document.getElementById('bottomNav').style.transform = 'translateY(0)';
    document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(`page-${hash}`);
    if (target) target.classList.add('active');
    else document.getElementById('page-home').classList.add('active');
    
    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    const activeLink = document.querySelector(`.bottom-nav a[href="#${hash}"]`);
    if (activeLink) activeLink.classList.add('active');
  }

  // ------------------ AUTH ------------------
  window.handleAuthSubmit = async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('authPassword').value;
    const isLogin = document.getElementById('tab-login').classList.contains('active');
    Swal.fire({ title: 'Processing...', didOpen: () => Swal.showLoading(), background: 'var(--bg-panel)', allowOutsideClick: false });
    try {
      if (isLogin) {
        let loginId = document.getElementById('loginId').value.trim();
        let email = loginId;
        if (!loginId.includes('@')) {
          const snap = await get(ref(db, `usernames/${loginId.toLowerCase()}`));
          if (!snap.exists()) throw new Error("Username not found");
          const userSnap = await get(ref(db, `users/${snap.val()}`));
          email = userSnap.val().email;
        }
        await signInWithEmailAndPassword(auth, email, pwd);
      } else {
        const email = document.getElementById('signupEmail').value.trim();
        const username = document.getElementById('signupUsername').value.trim();
        if (username.length < 3 || username.includes(' ')) throw new Error("Username min 3 chars, no spaces");
        const taken = await get(ref(db, `usernames/${username.toLowerCase()}`));
        if (taken.exists()) throw new Error("Username taken");
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
        await set(ref(db, `users/${cred.user.uid}`), { username, lower_username: username.toLowerCase(), email, uid: cred.user.uid });
        await set(ref(db, `usernames/${username.toLowerCase()}`), cred.user.uid);
      }
      window.closeAuthModal(null);
      Swal.close();
    } catch(err) { Swal.fire({ icon: 'error', title: 'Error', text: err.message, background:'var(--bg-panel)' }); }
  };

  window.loginWithGoogle = async () => {
    Swal.fire({ title: 'Google sign-in', didOpen: () => Swal.showLoading(), background: 'var(--bg-panel)' });
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const userSnap = await get(ref(db, `users/${result.user.uid}`));
      if (!userSnap.exists()) {
        Swal.close();
        const { value: chosen } = await Swal.fire({ title: 'Pick a username', input: 'text', showCancelButton: true, preConfirm: async (val) => {
          if (!val || val.includes(' ')) return Swal.showValidationMessage('Invalid');
          const exist = await get(ref(db, `usernames/${val.toLowerCase()}`));
          if (exist.exists()) return Swal.showValidationMessage('Taken');
          return val;
        }});
        if (!chosen) throw new Error("Username required");
        await set(ref(db, `users/${result.user.uid}`), { username: chosen, lower_username: chosen.toLowerCase(), email: result.user.email, uid: result.user.uid });
        await set(ref(db, `usernames/${chosen.toLowerCase()}`), result.user.uid);
      }
      window.closeAuthModal(null);
    } catch(err) { if(err.code !== 'auth/popup-closed-by-user') Swal.fire({ icon: 'error', text: err.message }); }
  };

  window.handleLogout = () => signOut(auth);
  window.openAuthModal = (mode) => { document.getElementById('authOverlay').classList.add('active'); window.switchAuthTab(mode); };
  window.closeAuthModal = (e) => { if (!e || e.target === document.getElementById('authOverlay')) document.getElementById('authOverlay').classList.remove('active'); };
  window.switchAuthTab = (mode) => {
    const isLogin = mode === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-signup').classList.toggle('active', !isLogin);
    document.getElementById('loginIdGroup').classList.toggle('d-none', !isLogin);
    document.getElementById('signupUsernameGroup').classList.toggle('d-none', isLogin);
    document.getElementById('signupEmailGroup').classList.toggle('d-none', isLogin);
    document.getElementById('submitBtnText').innerText = isLogin ? 'Log In' : 'Sign Up';
  };

  document.getElementById('chatBackBtn').addEventListener('click', closeChatAndGoHome);
  window.addEventListener('hashchange', route);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('landingView').classList.add('d-none');
      document.getElementById('appContainer').classList.remove('d-none');
      const userSnap = await get(ref(db, `users/${user.uid}`));
      if (userSnap.exists()) {
        document.getElementById('profName').innerText = userSnap.val().username;
        document.getElementById('profUsername').innerText = `@${userSnap.val().lower_username}`;
      } else {
        document.getElementById('profName').innerText = user.email.split('@')[0];
      }
      document.getElementById('profEmail').innerText = user.email;
      document.getElementById('profImg').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email.charAt(0)}&background=8b5cf6&color=fff`;
      loadInbox(user.uid);
      window.location.hash = '#home';
      route();
    } else {
      if (chatUnsubscribe) chatUnsubscribe();
      if (inboxUnsubscribe) inboxUnsubscribe();
      currentUser = null;
      document.getElementById('landingView').classList.remove('d-none');
      document.getElementById('appContainer').classList.add('d-none');
      window.location.hash = '';
    }
  });
</script>
</body>
</html>
